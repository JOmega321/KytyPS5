name: FSR 4.1.2 Linux conversion prototype
on:
  push:
    branches: [chen-kytyps5-fsr412-linux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install offline capture build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends wine64 gcc-mingw-w64-x86-64-posix libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers spirv-tools
      - name: Build recorder against pinned Khronos headers
        run: |
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git _Build/vulkan-headers
          git -C _Build/vulkan-headers checkout 73814d006638aa00bd553215b054f0f02e457e22
          bash tools/fsr412-vk/build-capture.sh "$PWD/_Build/capture-bin" "$PWD/_Build/vulkan-headers/include"
          curl -fL --retry 3 -o _Build/capture-bin/amd_fidelityfx_upscaler_vk.dll https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_vk.dll
          echo '4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7  _Build/capture-bin/amd_fidelityfx_upscaler_vk.dll' | sha256sum -c
      - name: Record synthetic INT8 host decisions (no GPU execution)
        env:
          WINEDEBUG: '-all'
          WINEARCH: win64
          WINEDLLOVERRIDES: 'vulkan-1=n;mscoree,mshtml='
        run: |
          export WINEPREFIX="$PWD/_Build/wine-prefix"
          bin="$PWD/_Build/capture-bin"
          mkdir -p _Build/capture-int8
          cd _Build/capture-int8
          timeout 120 /usr/lib/wine/wine64 "$bin/capture.exe" "Z:$bin/amd_fidelityfx_upscaler_vk.dll" int8 1280x720 1920x1080 3
      - name: Show host trace diagnostics (no shader or weight bytes)
        if: always()
        run: |
          if test -f _Build/capture-int8/trace.jsonl; then
            head -n 50 _Build/capture-int8/trace.jsonl
            tail -n 8 _Build/capture-int8/trace.jsonl
          fi
      - name: Audit observed model initializers and dispatch sequence
        run: |
          python3 tools/fsr412-vk/analyze_capture.py _Build/capture-int8 _Build/capture-bin/amd_fidelityfx_upscaler_vk.dll _Build/host-capture-int8.json
          python3 tools/fsr412-vk/check_replay_contract.py _Build/host-capture-int8.json 1280x720 1920x1080
      - name: Recover audited native test assets from the DLL
        run: |
          python3 tests/fsr412-host-audit.py
          python3 tools/fsr412-vk/recover_assets.py _Build/capture-bin/amd_fidelityfx_upscaler_vk.dll _Build/native-assets > _Build/recovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('tools/fsr412-vk/host-int8-t1080-m0.json').read_text())
          new=json.loads(Path('_Build/host-capture-int8.json').read_text())
          assert old['initializers']==new['initializers']
          for k,passes in old['frames'].items():
              assert [(p['entry'],p['sha256'],p['groups']) for p in passes]==[(p['entry'],p['sha256'],p['groups']) for p in new['frames'][k]]
          PY
          for shader in _Build/native-assets/t1080_m0/*.spv; do spirv-val --target-env vulkan1.3 "$shader"; done
      - name: Record and audit remaining INT8 tiers and quality families
        env:
          WINEDEBUG: '-all'
          WINEARCH: win64
          WINEDLLOVERRIDES: 'vulkan-1=n;mscoree,mshtml='
        run: |
          export WINEPREFIX="$PWD/_Build/wine-prefix"
          bin="$PWD/_Build/capture-bin"
          root="$PWD"
          while read -r set render output; do
            mkdir -p "$root/_Build/capture-$set"
            cd "$root/_Build/capture-$set"
            timeout 120 /usr/lib/wine/wine64 "$bin/capture.exe" "Z:$bin/amd_fidelityfx_upscaler_vk.dll" int8 "$render" "$output" 3
            cd "$root"
            python3 tools/fsr412-vk/analyze_capture.py "_Build/capture-$set" _Build/capture-bin/amd_fidelityfx_upscaler_vk.dll "_Build/host-capture-$set.json"
            python3 tools/fsr412-vk/check_replay_contract.py "_Build/host-capture-$set.json" "$render" "$output"
          done <<'CASES'
          t1080_m1 640x360 1920x1080
          t2160_m0 2560x1440 3840x2160
          t2160_m1 1280x720 3840x2160
          t1440_m0 1280x720 2560x1440
          CASES
      - name: Verify all committed recipes against fresh captures and prepare assets
        run: |
          python3 - <<'PYRECIPES'
          import json
          from pathlib import Path
          for family in ('t1080_m0','t1080_m1','t2160_m0','t2160_m1'):
              old=json.loads((Path('tools/fsr412-vk/recipes')/(family+'.json')).read_text())
              fresh='_Build/host-capture-'+('int8' if family=='t1080_m0' else family)+'.json'
              new=json.loads(Path(fresh).read_text())
              assert old['initializers']==new['initializers'], family
              for frame,passes in old['frames'].items():
                  assert [(x['entry'],x['sha256'],x['groups'],x['constants']) for x in passes]==[(x['entry'],x['sha256'],x['groups'],x['constants']) for x in new['frames'][frame]], family
          PYRECIPES
          python3 tools/fsr412-vk/recover_assets.py _Build/capture-bin/amd_fidelityfx_upscaler_vk.dll _Build/all-assets --all > _Build/all-recovery.json
          for shader in _Build/all-assets/*/*.spv; do spirv-val --target-env vulkan1.3 "$shader"; done
      - name: Build current-enough Khronos validation layer
        run: bash tools/fsr412-vk/build-validation.sh "$PWD/_Build/validation" "$PWD/_Build/vulkan-headers"
      - name: Build and execute native frames with software Vulkan and validation
        env:
          FSR412_VALIDATE: '1'
          VK_LAYER_VALIDATE_SYNC: '1'
        run: |
          set -o pipefail
          bash tools/fsr412-vk/build-frame-test.sh _Build/native-test "$PWD/_Build/vulkan-headers/include"
          lvp=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)
          test -n "$lvp"
          export VK_DRIVER_FILES="$lvp"
          export VK_LAYER_PATH="$PWD/_Build/validation/build/layers"
          export LD_LIBRARY_PATH="$PWD/_Build/validation/build/layers${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          while read -r family render output frames; do
            timeout 360 _Build/native-test/native-frame-test _Build/all-assets "_Build/native-$family.raw" "$render" "$output" "$frames" 2>&1 | tee "_Build/native-$family.log"
          done <<'FRAMES'
          t1080_m0 320x180 640x360 3
          t1080_m1 320x180 960x540 3
          t2160_m0 1280x720 2560x1440 1
          t2160_m1 1280x720 3840x2160 1
          FRAMES
          # Demon's Souls uses B10G11R11 packed HDR output. Exercise both final
          # writers: direct postpass with sharpening off, and RCAS with it on.
          while read -r family render output; do
            for mode in sharpen no-sharpen; do
              timeout 360 _Build/native-test/native-frame-test _Build/all-assets "_Build/packed-$family-$mode.raw" "$render" "$output" 3 r11g11b10 "$mode" 2>&1 | tee "_Build/packed-$family-$mode.log"
            done
          done <<'PACKED'
          t1080_m0 320x180 640x360
          t1080_m1 320x180 960x540
          t2160_m0 1280x720 2560x1440
          t2160_m1 1280x720 3840x2160
          PACKED
          cat _Build/native-t*.log _Build/packed-t*.log > _Build/native-frame-test.log
      - name: Package native frame test without AMD assets
        run: |
          dist=_Build/native-test-distribution
          mkdir -p "$dist/source/tools/fsr412-vk" "$dist/source/src/local/fsr411"
          cp _Build/native-test/native-frame-test "$dist/"
          cp tools/fsr412-vk/{extract_vk.py,adapt_spirv.py,recover_assets.py,host-int8-t1080-m0.json,run-native-test.sh,NATIVE-TEST.md} "$dist/"
          cp -r tools/fsr412-vk/recipes "$dist/"
          cp tools/fsr412-vk/{native_frame_test.cpp,build-frame-test.sh} "$dist/source/tools/fsr412-vk/"
          cp src/local/fsr4-formats.h "$dist/source/src/local/"
          cp src/local/fsr411/{fsr411.cpp,fsr411.h} "$dist/source/src/local/fsr411/"
          cp LICENSE "$dist/"
          cp _Build/native-frame-test.log "$dist/"
          git rev-parse HEAD > "$dist/SOURCE_COMMIT"
          cd "$dist"
          sha256sum native-frame-test extract_vk.py adapt_spirv.py recover_assets.py host-int8-t1080-m0.json run-native-test.sh > SHA256SUMS
      - name: Upload native frame test (no DLL, shaders, weights, or frames)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fsr412-native-frame-test-x86_64
          path: _Build/native-test-distribution/
          if-no-files-found: error
          retention-days: 30
      - name: Upload host audit metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fsr412-host-audit
          path: |
            _Build/host-capture-*.json
            _Build/native-t*.log
            _Build/packed-t*.log
            _Build/all-recovery.json
          if-no-files-found: ignore
          retention-days: 30
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test native loader and bounded extractor
        run: python3 tests/fsr412-vk-extract.py
      - name: Convert official Vulkan DLL GPU programs
        run: |
          mkdir -p _Build/fsr412
          curl -fL --retry 3 -o _Build/fsr412/upscaler.dll https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_vk.dll
          echo '4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7  _Build/fsr412/upscaler.dll' | sha256sum -c
          python3 tools/fsr412-vk/extract_vk.py _Build/fsr412/upscaler.dll _Build/fsr412/converted > _Build/fsr412/summary.json
          bash tools/fsr412-vk/build-native.sh _Build/fsr412/native
          _Build/fsr412/native/native-probe "$(realpath _Build/fsr412/native/libfsr412_spirv.so)" _Build/fsr412/converted/shaders.spvpack | tee _Build/fsr412/native-probe.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('_Build/fsr412/summary.json').read_text())
          assert report['dll_version'] == [4, 1, 2, 4555]
          assert report['unique_modules'] == 1002
          assert report['rejected_candidates'] == 0
          assert report['runtime_ready'] is False
          assert report['weights_recovered'] is False
          PY
      - name: Package generic native probe and conversion sources
        run: |
          mkdir -p _Build/fsr412/distribution
          cp _Build/fsr412/native/* _Build/fsr412/distribution/
          cp tools/fsr412-vk/{extract_vk.py,shader_pack.h,shader_pack.cpp,native_probe.cpp,build-native.sh,README.md} _Build/fsr412/distribution/
          cp LICENSE _Build/fsr412/distribution/
          cp _Build/fsr412/{summary.json,native-probe.log} _Build/fsr412/distribution/
          git rev-parse HEAD > _Build/fsr412/distribution/SOURCE_COMMIT
          cd _Build/fsr412/distribution
          sha256sum libfsr412_spirv.so native-probe > SHA256SUMS
      - name: Upload conversion prototype (no AMD binaries or shader data)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fsr412-linux-shader-prototype-x86_64
          path: _Build/fsr412/distribution/
          if-no-files-found: error
          retention-days: 30
