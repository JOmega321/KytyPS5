name: FSR 4 frame generation recorder
on:
  push:
    branches: [chen-kytyps5-fsr4-upscaler]
    paths: ['tools/fsr4fg-vk/**', '.github/workflows/fsr4fg-recorder.yml', 'tests/fsr4fg-legalize.py', 'tools/fsr412-vk/adapt_spirv.py',
            'tools/fsr412-vk/prune_bindings.py', 'tools/fsr412-vk/legalize_fp8.py', 'tools/fsr412-vk/build-fp8-tools.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the recorder against pinned Khronos headers
        run: |
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git _Build/vulkan-headers
          git -C _Build/vulkan-headers checkout 73814d006638aa00bd553215b054f0f02e457e22
          bash tools/fsr4fg-vk/build.sh _Build/fsr4fg-record "$PWD/_Build/vulkan-headers/include"
          bash tools/fsr4fg-vk/build.sh _Build/fsr4fg-record-asan "$PWD/_Build/vulkan-headers/include" -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
      - name: Fetch AMD's frame generation DLL (SDK 2.4.0, pinned)
        run: |
          curl -fL --retry 3 -o _Build/amd_fidelityfx_framegeneration_vk.dll https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_framegeneration_vk.dll
          echo 'd002dabff8c5e71eaa715fc99438cd4dc81230262a7897b16bc402efec3498b4  _Build/amd_fidelityfx_framegeneration_vk.dll' | sha256sum -c
      - name: Record synthetic frames (no Wine, no GPU execution)
        run: |
          set -o pipefail
          root="$PWD"
          dll="$root/_Build/amd_fidelityfx_framegeneration_vk.dll"
          while read -r name display render frames; do
            mkdir -p "_Build/run-$name"
            (cd "_Build/run-$name" && timeout 300 "$root/_Build/fsr4fg-record" "$dll" "$display" "$render" "$frames" 2>&1 | tee log.txt)
            python3 -I tools/fsr4fg-vk/analyze_fg.py "_Build/run-$name" "$dll" "_Build/contract-$name.json"
          done <<'RUNS'
          1440 2560x1440 1280x720 3
          1440again 2560x1440 1280x720 3
          1080 1920x1080 960x540 2
          2160 3840x2160 1920x1080 2
          4320 7680x4320 3840x2160 1
          RUNS
      - name: Check the contracts
        run: |
          d=tools/fsr4fg-vk
          python3 -I $d/check_contract.py _Build/contract-1440.json mlfi_4k $d/contracts/fg402-2560x1440-render1280x720.json
          python3 -I $d/check_contract.py _Build/contract-1440again.json mlfi_4k _Build/contract-1440.json
          python3 -I $d/check_contract.py _Build/contract-1080.json mlfi_4k
          python3 -I $d/check_contract.py _Build/contract-2160.json mlfi_4k
          python3 -I $d/check_contract.py _Build/contract-4320.json mlfi_8k
          if python3 -I $d/check_contract.py _Build/contract-4320.json mlfi_4k; then echo 'checker accepted a wrong family' >&2; exit 1; fi
      - name: Without FP8 the 4.0.2 provider is not offered (and no fallback is recorded)
        run: |
          mkdir -p _Build/run-nofp8 && cd _Build/run-nofp8
          set +e
          timeout 120 ../fsr4fg-record ../amd_fidelityfx_framegeneration_vk.dll 2560x1440 1280x720 1 --no-fp8 2>&1 | tee log.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 5
          grep -q '^provider .* 3\.1\.6$' log.txt
          if grep -q '^provider .* 4\.0\.2$' log.txt; then exit 1; fi
      - name: Host under AddressSanitizer and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p _Build/run-asan && cd _Build/run-asan
          timeout 600 ../fsr4fg-record-asan ../amd_fidelityfx_framegeneration_vk.dll 2560x1440 1280x720 2
      - name: Keep the contracts and logs (no AMD shader or weight bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr4fg-contracts
          path: |
            _Build/contract-*.json
            _Build/run-*/log.txt
          retention-days: 14

  gpu-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build tools and software Vulkan
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build cmake libvulkan-dev mesa-vulkan-drivers patchelf python3-full
      - name: Build pinned SPIR-V tools and fetch AMD's DLL (SDK 2.4.0, pinned)
        run: |
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git _Build/vulkan-headers
          git -C _Build/vulkan-headers checkout 73814d006638aa00bd553215b054f0f02e457e22
          bash tools/fsr412-vk/build-fp8-tools.sh "$PWD/_Build/fp8-tools"
          curl -fL --retry 3 -o _Build/fg.dll https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_framegeneration_vk.dll
          echo 'd002dabff8c5e71eaa715fc99438cd4dc81230262a7897b16bc402efec3498b4  _Build/fg.dll' | sha256sum -c
      - name: Prepare all 416 programs; every result passes strict Vulkan validation; matches the committed manifest
        run: |
          python3 -I tools/fsr4fg-vk/prepare_fg.py _Build/fg.dll _Build/prepared --spirv-tools _Build/fp8-tools/build/tools | tee _Build/prepare.json
          python3 -I -c 'import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); assert a==b, "prepared shaders differ from tools/fsr4fg-vk/prepared-manifest.json"' _Build/prepared/manifest.json tools/fsr4fg-vk/prepared-manifest.json
          test "$(find _Build/prepared -name '*.spv' | wc -l)" -eq 165
      - name: The upscaler's FP8 preparation is unchanged by it
        run: |
          curl -fL --retry 3 -o _Build/upscaler.dll https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_vk.dll
          echo '4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7  _Build/upscaler.dll' | sha256sum -c
          python3 -I tests/fsr4fg-legalize.py _Build/upscaler.dll
      - name: Build the GPU test (AMD runtime through Windows-ABI Vulkan thunks)
        run: bash tools/fsr4fg-vk/build-gpu.sh _Build/fsr4fg-gpu "$PWD/_Build/vulkan-headers"
      - name: Software Vulkan probe (no FP8, so AMD offers 3.1.6 only)
        run: |
          export VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)
          test -n "$VK_DRIVER_FILES"
          _Build/fsr4fg-gpu _Build/fg.dll _Build/prepared _Build/probe --probe 2>&1 | tee _Build/probe.log
          grep -q '^AMD provider offered: 3\.1\.6$' _Build/probe.log
          if grep -q '^AMD provider offered: 4\.0\.2$' _Build/probe.log; then exit 1; fi
      - name: Package the GPU test without AMD bytes and check it end to end
        run: |
          /usr/bin/python3 tools/fsr4fg-vk/package-fg-test.py _Build/fsr4fg-gpu _Build/fp8-tools "_Build/FSR4 FG GPU test"
          (cd "_Build/FSR4 FG GPU test" && sha256sum --quiet -c SHA256SUMS)
          chmod -x "_Build/FSR4 FG GPU test/fsr4fg-gpu" "_Build/FSR4 FG GPU test/prebuilt/bin/spirv-opt"
          export VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)
          mkdir -p _Build/bundle-run && cd _Build/bundle-run
          status=0
          bash "../FSR4 FG GPU test/run-fg-test.sh" "$PWD/../fg.dll" > check.log 2>&1 || status=$?
          cat check.log
          test "$status" -eq 3
          grep -q 'lacks features AMD FSR 4 frame generation needs' check.log
          cmp fsr4fg-gpu-test.*/prepared/manifest.json ../../tools/fsr4fg-vk/prepared-manifest.json
      - name: Upload the GPU test (hardware execution unverified)
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-fsr4fg-gpu-test-x86_64
          path: _Build/FSR4 FG GPU test/
          if-no-files-found: error
          retention-days: 30
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr4fg-gpu-test-ci-logs
          path: |
            _Build/*.log
            _Build/prepare.json
            _Build/bundle-run/check.log
          if-no-files-found: ignore
          retention-days: 14
