name: Build AppImage PR1747 test

on:
  workflow_dispatch:
  push:
    branches: [appimage-pr1747-test]

permissions:
  contents: read
  actions: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang lld ninja-build cmake glslang-tools python3 pkg-config ccache \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libwayland-dev wayland-protocols libvulkan1 \
            desktop-file-utils curl file patchelf xvfb xauth \
            libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: |
          cmake -S . -B _Build/appimage -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DKYTY_BUILD_ORIGIN=Fork \
            -DKYTY_BUILD_REPOSITORY="$GITHUB_REPOSITORY" \
            2>&1 | tee configure.log
          for feature in SDL_ALSA SDL_PULSEAUDIO SDL_WAYLAND SDL_X11 SDL_LIBUDEV SDL_DBUS; do
            grep -qE "^--   ${feature} +\\(Wanted: ON\\): ON" configure.log
          done

      - name: Build and install
        run: |
          cmake --build _Build/appimage --target launcher resource_tracking_tests resource_materialization_tests --parallel "$(nproc)"
          cmake --install _Build/appimage --prefix "$PWD/_Build/appimage/install"

      - name: Test shader resource tracking and materialization
        run: |
          ctest --test-dir _Build/appimage --output-on-failure \
            -R '^(resource_tracking|resource_materialization)$' 2>&1 | tee resource-tests.log

      - name: Package
        run: |
          desktop-file-validate packaging/appimage/kytyps5.desktop
          VERSION="PR1747-$(git rev-parse --short HEAD)" bash packaging/appimage/package.sh _Build/appimage/install

      - name: Check packaged CLI and graphical startup
        run: |
          image="$(realpath _Build/appimage-output/*.AppImage)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export HOME="$RUNNER_TEMP/kyty-pr1747-home"
          export XDG_DATA_HOME="$RUNNER_TEMP/kyty-pr1747-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/kyty-pr1747-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/kyty-pr1747-cache"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          "$image" --emulator --help
          set +e
          QT_DEBUG_PLUGINS=1 timeout --signal=TERM 15s xvfb-run -a "$image" --local > launcher.log 2>&1
          result=$?
          set -e
          cat launcher.log
          test "$result" -eq 124
          test -d "$XDG_DATA_HOME/KytyPS5-PR1747"
          if grep -Ei 'could not load the Qt platform plugin|error while loading shared libraries|symbol lookup error|Aborted|Segmentation fault' launcher.log; then
            exit 1
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-PR1747-test-x86_64
          path: _Build/appimage-output/*
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-PR1747-test-logs
          path: |
            configure.log
            launcher.log
            resource-tests.log
            _Build/appimage/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
