name: chenxiao07 AppImage
on:
  push:
    branches: [chen-kytyps5-fsr4-upscaler]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: chenxiao07-appimage-publish
  cancel-in-progress: false
jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ccache ninja-build cmake spirv-tools python3 python3-full glslang-tools patchelf desktop-file-utils xvfb xauth fonts-dejavu-core libvulkan1 libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev wayland-protocols
      - name: Test asset-builder process handling
        run: |
          clang++ -std=c++20 -pthread -Ilauncher-linux launcher-linux/asset-builder.cpp tests/launcher-asset-builder.cpp -o /tmp/test-asset-builder
          /tmp/test-asset-builder
          bash -n tools/fsr412-vk/build_assets.sh packaging/chen-appimage/AppRun
          python3 tests/fsr412-vk-extract.py
          python3 tests/fsr412-host-audit.py
          python3 tests/appimage-name.py
          python3 -m py_compile tools/fsr412-vk/recover_assets.py packaging/chen-appimage/package.py packaging/chen-appimage/emit_screenshot.py
      - name: Choose dated AppImage filename
        id: build_name
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/chen-appimage/appimage-name.py --github-output "$GITHUB_OUTPUT" --metadata _Build/build-name.json
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ccache
          key: native-clang-ubuntu24-${{ github.sha }}
          restore-keys: native-clang-ubuntu24-
      - name: Configure and build native programs
        run: |
          ccache --max-size 1500M
          cmake -S . -B _Build/appimage -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DKYTY_BUILD_LAUNCHER=OFF \
            -DCMAKE_C_FLAGS_RELEASE='-O3 -DNDEBUG -march=x86-64-v3' \
            -DCMAKE_CXX_FLAGS_RELEASE='-O3 -DNDEBUG -march=x86-64-v3 -flto=thin' \
            -DCMAKE_EXE_LINKER_FLAGS='-fuse-ld=lld -flto=thin' \
            -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY="$GITHUB_REPOSITORY"
          cmake --build _Build/appimage --target kyty_emulator kyty_launcher kyty_shader_precompile --parallel 4
          _Build/appimage/kyty_emulator --help > _Build/native-help.log
          _Build/appimage/kyty_launcher --help >> _Build/native-help.log
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ccache
          key: native-clang-ubuntu24-${{ github.sha }}
      - name: Preserve native build before packaging
        run: |
          git rev-parse HEAD > _Build/appimage/native-source.txt
          git submodule status --recursive > _Build/appimage/native-dependencies.txt
          clang --version > _Build/appimage/native-toolchain.txt
          ldd --version >> _Build/appimage/native-toolchain.txt
          dpkg-query -W >> _Build/appimage/native-toolchain.txt
          find _Build/appimage/externals -name '*.zip' -exec sha256sum {} + > _Build/appimage/native-downloads.sha256
          tar -C _Build/appimage -czf _Build/native-binaries.tar.gz \
            kyty_emulator kyty_launcher kyty_shader_precompile CMakeCache.txt kytyGitVersion.h \
            native-source.txt native-dependencies.txt native-toolchain.txt native-downloads.sha256
          cd _Build
          sha256sum native-binaries.tar.gz > native-binaries.tar.gz.sha256
      - name: Upload native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chenxiao07-native-x86_64
          path: |
            _Build/native-binaries.tar.gz
            _Build/native-binaries.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Build bundled native FP8 preparation tools
        run: bash tools/fsr412-vk/build-fp8-tools.sh "$PWD/_Build/fp8-tools"
      - name: Assemble AppDir
        run: |
          /usr/bin/python3 packaging/chen-appimage/package.py _Build/appimage _Build/KytyPS5.AppDir
          python3 packaging/chen-appimage/audit_appdir.py _Build/KytyPS5.AppDir --arch x86_64 --resolve
          tar -C _Build -czf _Build/native-stage.tar.gz KytyPS5.AppDir
      - name: Build AppImage
        env:
          APPIMAGE_NAME: ${{ steps.build_name.outputs.appimage_name }}
        run: |
          curl -fL --retry 3 -o _Build/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  _Build/appimagetool' | sha256sum -c
          chmod +x _Build/appimagetool
          curl -fL --retry 3 -o _Build/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo '617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  _Build/runtime-x86_64' | sha256sum -c
          mkdir -p _Build/output
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 _Build/appimagetool --runtime-file _Build/runtime-x86_64 _Build/KytyPS5.AppDir "_Build/output/$APPIMAGE_NAME"
          cp _Build/build-name.json _Build/output/BUILD-INFO.json
          cd _Build/output
          sha256sum *.AppImage > SHA256SUMS
      - name: Validate final AppImage
        run: |
          set -euo pipefail
          image="$(realpath _Build/output/*.AppImage)"
          mkdir -p '_Build/smoke home' _Build/screenshots
          export HOME="$PWD/_Build/smoke home"
          export XDG_DATA_HOME="$HOME/data" XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/kyty-xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --emulator --help > _Build/final-help.log
          python3 tests/launcher-fsr4-selection.py "$image"
          python3 - <<'PYSET'
          import json, os
          from pathlib import Path
          root = Path(os.environ['XDG_DATA_HOME']) / 'KytyPS5-chenxiao07'
          (root / 'launcher-settings.json').write_text(json.dumps({
              'upscaler': 'fsr4', 'fsr4_watermark': True,
              'fsr4_precision': 'fp8', 'fsr4_radv_matrix_conversions': False,
              'shader_cache_dir': str(root / 'custom shader cache'),
              'shader_workers': 1, 'shader_warmup_background': False, 'precompile_jobs': 2}))
          PYSET
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --dry-run > _Build/final-launch.log
          grep -q "KYTY_UPSCALER='fsr4'" _Build/final-launch.log
          grep -q "KYTY_FSR4_WATERMARK='1'" _Build/final-launch.log
          grep -q "KYTY_FSR4_PRECISION='fp8'" _Build/final-launch.log
          grep -q "radv_cooperative_matrix2_nv='true'" _Build/final-launch.log
          grep -q "KYTY_PIPELINE_CACHE_DIR=.*custom shader cache" _Build/final-launch.log
          grep -q "KYTY_SHADER_PREFETCH_THREADS='1'" _Build/final-launch.log
          grep -q "KYTY_SHADER_FOLLOW_THREADS='1'" _Build/final-launch.log
          grep -q "KYTY_SHADER_WARMUP_BACKGROUND_THREADS='1'" _Build/final-launch.log
          grep -q "KYTY_SHADER_WARMUP_BACKGROUND='0'" _Build/final-launch.log
          APPIMAGE_EXTRACT_AND_RUN=1 SDL_VIDEODRIVER=x11 xvfb-run -a "$image" --screenshot "$PWD/_Build/screenshots" > _Build/final-gui.log 2>&1
          test "$(find _Build/screenshots -name '*.bmp' | wc -l)" -ge 8
          # Exercise the actual GUI-to-builder path with a controlled dependency failure.
          mkdir -p _Build/setup-failure
          printf '%s\n' "echo '[FSR412] Checking DLL version'" "echo 'Missing tools: test dependency' >&2" 'exit 4' > _Build/mock-asset-build.sh
          printf 'not a DLL' > _Build/test.dll
          KYTY_FSR412_BUILD_SCRIPT="$PWD/_Build/mock-asset-build.sh" APPIMAGE_EXTRACT_AND_RUN=1 SDL_VIDEODRIVER=x11 timeout 30s xvfb-run -a "$image" --prepare-fsr412 "$PWD/_Build/test.dll" --screenshot "$PWD/_Build/setup-failure" > _Build/setup-failure.log 2>&1
          grep -q 'Missing tools: test dependency' "$XDG_DATA_HOME"/KytyPS5-chenxiao07/logs/fsr412-build-*.log
          test -f _Build/setup-failure/8-fsrsetup.bmp
          # The real packaged preparation script must reject an invalid DLL.
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --build-fsr412 "$PWD/_Build/test.dll" > _Build/invalid-dll.log 2>&1 || status=$?
          test "$status" -eq 2
          grep -q 'Preparation failed:' _Build/invalid-dll.log
          cd _Build
          "$image" --appimage-extract > /dev/null
          ./squashfs-root/AppRun --emulator --help > extracted-help.log
          # Hide development tools and host Python; exercise the bundled helpers after relocation.
          mkdir -p "$RUNNER_TEMP/kyty-base-tools"
          for command in bash cat chmod cp dirname env install ln mkdir mktemp mv readlink realpath rm touch true; do
            ln -s "$(type -P "$command")" "$RUNNER_TEMP/kyty-base-tools/$command"
          done
          PATH="$RUNNER_TEMP/kyty-base-tools" ./squashfs-root/AppRun --fsr412-tools-check > bundled-tools-check.log 2>&1
          grep -q 'Bundled native Vulkan asset tools: OK' bundled-tools-check.log
          # Use the bundled interpreter to prepare every model with host Python hidden.
          curl -fL --retry 3 -o sdk-upscaler.dll https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_vk.dll
          echo '4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7  sdk-upscaler.dll' | sha256sum -c
          PATH="$RUNNER_TEMP/kyty-base-tools" ./squashfs-root/AppRun --build-fsr412 "$PWD/sdk-upscaler.dll" > bundled-assets.json 2> bundled-assets.log
          grep -q 'Ready: four INT8' bundled-assets.log
          python3 - <<'PYASSETS'
          import json, os
          from pathlib import Path
          root=Path(os.environ['XDG_DATA_HOME'])/'KytyPS5-chenxiao07/fsr4_412'
          assert (root/'ASSET_VERSION').read_text().strip()=='FSR412_VULKAN_INT8_4.1.2.4555'
          manifest=json.loads(Path('bundled-assets.json').read_text())
          assert len(manifest['sets'])==8
          assert (root/'fp8/ASSET_VERSION').read_text().strip()=='FSR412_VULKAN_FP8_4.1.2.4555'
          for family in manifest['sets']:
              assert len(list((root/family).glob('*.spv')))==29
              assert (root/family/'initializer.bin').stat().st_size==131072
          PYASSETS
          # A failed FP8 preparation must preserve the installed INT8/FP8 assets.
          ./squashfs-root/usr/payload/tools/fsr412-vk/prebuilt/bin/kyty-python3 - <<'PYROLLBACK'
          import os,sys
          from pathlib import Path
          bundle=Path('squashfs-root/usr/payload/tools/fsr412-vk').resolve()
          sys.path.insert(0,str(bundle))
          from recover_assets import recover_all
          root=Path(os.environ['XDG_DATA_HOME'])/'KytyPS5-chenxiao07/fsr4_412'
          before=(root/'asset-provenance.json').read_bytes()
          try:
              recover_all(Path('sdk-upscaler.dll').read_bytes(),root,True,Path('missing-tools'))
          except ValueError:
              pass
          else:
              raise AssertionError('Missing FP8 tools were accepted')
          assert (root/'asset-provenance.json').read_bytes()==before
          assert (root/'fp8/ASSET_VERSION').is_file()
          PYROLLBACK
          # Exercise the actual GUI-to-builder success path with the private tools.
          mkdir -p setup-success
          APPIMAGE_EXTRACT_AND_RUN=1 SDL_VIDEODRIVER=x11 timeout 120s xvfb-run -a "$image" --prepare-fsr412 "$PWD/sdk-upscaler.dll" --screenshot "$PWD/setup-success" > setup-success.log 2>&1
          grep -q 'Ready: four INT8 and four FP8' "$XDG_DATA_HOME"/KytyPS5-chenxiao07/logs/fsr412-build-*.log
          test -f setup-success/8-fsrsetup.bmp
          # Verify that selecting INT8 clears the managed RADV opt-in.
          python3 - <<'PYINT8'
          import json,os
          from pathlib import Path
          p=Path(os.environ['XDG_DATA_HOME'])/'KytyPS5-chenxiao07/launcher-settings.json'
          data=json.loads(p.read_text());data['fsr4_precision']='int8';p.write_text(json.dumps(data))
          PYINT8
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --dry-run > final-int8-launch.log
          grep -q "KYTY_FSR4_PRECISION='int8'" final-int8-launch.log
          if grep -q "radv_cooperative_matrix2_nv='true'" final-int8-launch.log; then exit 1; fi
          python3 ../packaging/chen-appimage/emit_screenshot.py screenshots/3-graphics.bmp setup-success/8-fsrsetup.bmp
          test -d "$XDG_DATA_HOME/KytyPS5-chenxiao07/.runtime"
      - name: Upload AppImage and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build_name.outputs.artifact_name }}
          overwrite: true
          path: _Build/output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build and startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chenxiao07-build-evidence
          path: |
            _Build/*.log
            _Build/screenshots/
            _Build/setup-failure/
            _Build/setup-success/
            _Build/setup-success.log
            _Build/native-stage.tar.gz
            _Build/appimage/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
