name: chenxiao07 AppImage
on:
  push:
    branches: [appimage-chenxiao07, chen-kytyps5-fsr4]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake gcc-mingw-w64-x86-64 spirv-tools python3 python3-full glslang-tools patchelf desktop-file-utils xvfb xauth fonts-dejavu-core libvulkan1 libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev wayland-protocols
      - name: Test asset-builder process handling
        run: |
          clang++ -std=c++20 -pthread -Ilauncher-linux launcher-linux/asset-builder.cpp tests/launcher-asset-builder.cpp -o /tmp/test-asset-builder
          /tmp/test-asset-builder
          bash -n tools/fsr4cap/build_assets.sh packaging/chen-appimage/AppRun
      - name: Build bundled FSR4 capture tools
        run: packaging/chen-appimage/build-capture-tools.sh
      - name: Reuse verified unchanged native payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 packaging/chen-appimage/reuse-native.py
      - name: Configure and build native programs
        if: env.KYTY_REUSE_NATIVE != '1'
        run: |
          cmake -S . -B _Build/appimage -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DKYTY_BUILD_LAUNCHER=OFF \
            -DCMAKE_C_FLAGS_RELEASE='-O3 -DNDEBUG -march=x86-64-v3' \
            -DCMAKE_CXX_FLAGS_RELEASE='-O3 -DNDEBUG -march=x86-64-v3 -flto=thin' \
            -DCMAKE_EXE_LINKER_FLAGS='-fuse-ld=lld -flto=thin' \
            -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY="$GITHUB_REPOSITORY"
          cmake --build _Build/appimage --target kyty_emulator kyty_launcher kyty_shader_precompile --parallel 4
          _Build/appimage/kyty_emulator --help > _Build/native-help.log
          _Build/appimage/kyty_launcher --help >> _Build/native-help.log
      - name: Preserve native build before packaging
        if: env.KYTY_REUSE_NATIVE != '1'
        run: |
          git rev-parse HEAD > _Build/appimage/native-source.txt
          git submodule status --recursive > _Build/appimage/native-dependencies.txt
          clang --version > _Build/appimage/native-toolchain.txt
          ldd --version >> _Build/appimage/native-toolchain.txt
          dpkg-query -W >> _Build/appimage/native-toolchain.txt
          find _Build/appimage/externals -name '*.zip' -exec sha256sum {} + > _Build/appimage/native-downloads.sha256
          tar -C _Build/appimage -czf _Build/native-binaries.tar.gz \
            kyty_emulator kyty_launcher kyty_shader_precompile CMakeCache.txt kytyGitVersion.h \
            native-source.txt native-dependencies.txt native-toolchain.txt native-downloads.sha256
          cd _Build
          sha256sum native-binaries.tar.gz > native-binaries.tar.gz.sha256
      - name: Upload native build
        if: env.KYTY_REUSE_NATIVE != '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chenxiao07-native-x86_64
          path: |
            _Build/native-binaries.tar.gz
            _Build/native-binaries.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Assemble AppDir
        run: |
          /usr/bin/python3 packaging/chen-appimage/package.py _Build/appimage _Build/KytyPS5.AppDir
          python3 packaging/chen-appimage/audit_appdir.py _Build/KytyPS5.AppDir --arch x86_64 --resolve
          tar -C _Build -czf _Build/native-stage.tar.gz KytyPS5.AppDir
      - name: Build AppImage
        run: |
          curl -fL --retry 3 -o _Build/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  _Build/appimagetool' | sha256sum -c
          chmod +x _Build/appimagetool
          curl -fL --retry 3 -o _Build/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo '617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  _Build/runtime-x86_64' | sha256sum -c
          mkdir -p _Build/output
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 _Build/appimagetool --runtime-file _Build/runtime-x86_64 _Build/KytyPS5.AppDir "_Build/output/KytyPS5-chenxiao07-${GITHUB_SHA:0:8}-x86_64.AppImage"
          cd _Build/output
          sha256sum *.AppImage > SHA256SUMS
      - name: Validate final AppImage
        run: |
          set -euo pipefail
          image="$(realpath _Build/output/*.AppImage)"
          mkdir -p '_Build/smoke home' _Build/screenshots
          export HOME="$PWD/_Build/smoke home"
          export XDG_DATA_HOME="$HOME/data" XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/kyty-xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --emulator --help > _Build/final-help.log
          python3 - <<'PYSET'
          import json, os
          from pathlib import Path
          root = Path(os.environ['XDG_DATA_HOME']) / 'KytyPS5-chenxiao07'
          (root / 'launcher-settings.json').write_text(json.dumps({
              'upscaler': 'fsr4', 'fsr4_watermark': True,
              'shader_cache_dir': str(root / 'custom shader cache'),
              'shader_workers': 1, 'shader_warmup_background': False, 'precompile_jobs': 2}))
          PYSET
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --dry-run > _Build/final-launch.log
          grep -q "KYTY_UPSCALER='fsr4'" _Build/final-launch.log
          grep -q "KYTY_FSR4_WATERMARK='1'" _Build/final-launch.log
          grep -q "KYTY_PIPELINE_CACHE_DIR=.*custom shader cache" _Build/final-launch.log
          grep -q "KYTY_SHADER_PREFETCH_THREADS='1'" _Build/final-launch.log
          grep -q "KYTY_SHADER_FOLLOW_THREADS='1'" _Build/final-launch.log
          grep -q "KYTY_SHADER_WARMUP_BACKGROUND_THREADS='1'" _Build/final-launch.log
          grep -q "KYTY_SHADER_WARMUP_BACKGROUND='0'" _Build/final-launch.log
          APPIMAGE_EXTRACT_AND_RUN=1 SDL_VIDEODRIVER=x11 xvfb-run -a "$image" --screenshot "$PWD/_Build/screenshots" > _Build/final-gui.log 2>&1
          test "$(find _Build/screenshots -name '*.bmp' | wc -l)" -ge 8
          # Exercise the actual GUI-to-builder path with a controlled dependency failure.
          mkdir -p _Build/setup-failure
          printf '%s\n' "echo '[FSR411] Checking build tools'" "echo 'Missing tools: test dependency' >&2" 'exit 4' > _Build/mock-asset-build.sh
          printf 'not a DLL' > _Build/test.dll
          KYTY_FSR411_BUILD_SCRIPT="$PWD/_Build/mock-asset-build.sh" APPIMAGE_EXTRACT_AND_RUN=1 SDL_VIDEODRIVER=x11 timeout 30s xvfb-run -a "$image" --prepare-fsr411 "$PWD/_Build/test.dll" --screenshot "$PWD/_Build/setup-failure" > _Build/setup-failure.log 2>&1
          grep -q 'Missing tools: test dependency' "$XDG_DATA_HOME"/KytyPS5-chenxiao07/logs/fsr411-build-*.log
          test -f _Build/setup-failure/8-fsrsetup.bmp
          # The real packaged capture script must reject an invalid DLL before capture.
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --build-fsr411 "$PWD/_Build/test.dll" > _Build/invalid-dll.log 2>&1 || status=$?
          test "$status" -eq 2
          grep -q 'Not usable:' _Build/invalid-dll.log
          cd _Build
          "$image" --appimage-extract > /dev/null
          ./squashfs-root/AppRun --emulator --help > extracted-help.log
          # Hide development tools and host Python; exercise the bundled helpers after relocation.
          mkdir -p "$RUNNER_TEMP/kyty-base-tools"
          for command in bash cat chmod cp dirname env install ln mkdir mktemp mv readlink realpath rm touch true; do
            ln -s "$(type -P "$command")" "$RUNNER_TEMP/kyty-base-tools/$command"
          done
          PATH="$RUNNER_TEMP/kyty-base-tools" ./squashfs-root/AppRun --fsr411-tools-check > bundled-tools-check.log 2>&1
          grep -q 'Bundled translator and SPIR-V round trip: OK' bundled-tools-check.log
          test -d "$XDG_DATA_HOME/KytyPS5-chenxiao07/.runtime"
      - name: Upload AppImage and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KytyPS5-chenxiao07-AppImage-x86_64
          path: _Build/output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build and startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chenxiao07-build-evidence
          path: |
            _Build/*.log
            _Build/screenshots/
            _Build/setup-failure/
            _Build/native-stage.tar.gz
            _Build/appimage/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
